# Servidor de PerezApp en Cloudflare Workers.
# La clave de Groq NO va aquí: se guarda como secreto (GROQ_API_KEY) en Cloudflare.
name = "perezapp-api"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# Clave pública del generador de licencias (se rellena al activar las licencias)
PUBLIC_KEY = "BI6d7Tsc7Cn7uNwK5eaQlA3qsY3sWczwEKedbHGpMLwD2q6lZ15bB4rJ9H1Mruui9-tDQ697ec4tqszus-JmJFc"
ALLOWED_ORIGINS = "https://iamikepm-ui.github.io"
# Comprobación de salud: https://<nombre>.<tu-subdominio>.workers.dev/v1/health
LIMIT_STT_DAY = "300"
LIMIT_LLM_DAY = "600"
REVOKED = ""

# Contador de usos y licencias anuladas: Cloudflare lo crea solo al publicar
[[kv_namespaces]]
binding = "PZ_KV"
